services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.8
    container_name: jellyfin
    user: "1000:1000"
    ports:
      - "8096:8096/tcp"
      - "7359:7359/udp"
    volumes:
      - ./.data/jellyfin/config:/config
      - ./.data/jellyfin/cache:/cache
      - /home/${USER}/Videos:/media:ro
    restart: unless-stopped
